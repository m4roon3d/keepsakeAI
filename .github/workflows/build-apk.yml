name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          { grep -E '^e: |error:|FAILED|What went wrong' -A3 build.log || tail -80 build.log; } | head -150 > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"
          { echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: keepsake AI debug build ${{ github.run_number }}
          body: Debug APK built from ${{ github.sha }}. Download app-debug.apk and install on your phone.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
